name: Deploy Backend EPP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-epp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            bash /opt/deploy/deploy-backend-epp.sh

            BACKEND_PATH="${{ secrets.VPS_BACKEND_PATH }}"
            if [ -z "$BACKEND_PATH" ]; then
              echo "Falta configurar el secret VPS_BACKEND_PATH con la ruta del backend en el VPS."
              exit 1
            fi

            cd "$BACKEND_PATH"
            npm run db:apply-idempotent
